apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
data:
  gpuworker: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        resources:
        - name: nvidia.com/gpu
          replicas: 4
  biggpuworker: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        resources:
        - name: nvidia.com/gpu
          replicas: 2


# This 'worker' is the label that this config applied to.